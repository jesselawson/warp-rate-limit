[package]
name = "warp-rate-limit"
version = "0.4.0"
edition = "2021"
description = "Rate-limiting middleware for the Warp web framework"
authors = ["Jesse Lawson <jesse@lawsonry.com>"]
license = "MIT"
repository = "https://github.com/jesselawson/warp-rate-limit"
documentation = "https://docs.rs/warp-rate-limit"
readme = "README.md"
keywords = ["warp", "rate-limit", "middleware", "web", "async"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# 0.4.3 minimum: warp 0.4.0-0.4.2 lack the addr::remote() filter this crate is built on
warp = "0.4.3"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = "0.4.39"
serde = { version = "1.0.217", features = ["derive"] }

[dev-dependencies]
# warp::test and warp::serve are opt-in features as of 0.4
warp = { version = "0.4.3", features = ["server", "test"] }
tokio-test = "0.4"
tracing-subscriber = "0.3"
serde_json = "1.0"
